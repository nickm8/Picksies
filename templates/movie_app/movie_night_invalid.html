<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Access Token</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center py-5">
                        <i class="fas fa-exclamation-triangle fa-4x text-danger mb-4"></i>
                        <h3 class="mb-3">Invalid or Expired Token</h3>
                        <p class="text-muted mb-4">
                            The access token for this movie night is invalid or has expired. 
                            Please request a new link from the movie night creator.
                        </p>
                        <div class="alert alert-warning" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <strong>Possible reasons:</strong>
                            <ul class="list-unstyled mt-2 mb-0">
                                <li>• The link is corrupted or incomplete</li>
                                <li>• The movie night has been deactivated</li>
                                <li>• The token has expired</li>
                            </ul>
                        </div>
                        <a href="{% url 'movie_app:homepage' %}" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>Go to Homepage
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
